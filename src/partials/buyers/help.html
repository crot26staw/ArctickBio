  <div class="help__intro">
    <p class="help__lead" data-js-title-reveal data-title-reveal-start="top bottom">Есть вопросы? <br>Найдите ответы здесь</p>
    <h1 class="help__title" data-js-title-reveal data-title-reveal-start="top bottom">Покупателям</h1>
  </div>

  <!-- Панель вопросов: меню разделов прилипает при скролле, активный раздел — js/modules/anchor-nav.js -->
  <div class="help__panel" data-header-theme="light">
    <aside class="help__aside">
      <nav aria-label="Разделы">
        <ul class="help__menu" data-js-anchor-nav>
          <li><a class="help__link is-active" href="#help-general" aria-current="true" data-js-roll>Общие вопросы</a></li>
          <li><a class="help__link" href="#help-delivery" data-js-roll>Доставка</a></li>
          <li><a class="help__link" href="#help-payment" data-js-roll>Оплата</a></li>

        </ul>

      <p class="help__note">Не&nbsp;нашли ответы на&nbsp;свои вопросы? <a href="#">Напишите</a> нам, и&nbsp;мы&nbsp;ответим вам в&nbsp;кратчайшие сроки.</p>
    </aside>

    <div class="help__content" data-js-accordion-group>
      <section class="help__group" id="help-general" aria-labelledby="help-general-title">
        <h2 class="help__group-title" id="help-general-title" data-js-title-reveal>Общие вопросы</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-1","expanded":"false","question":"Какую упаковку выбрать: 15&nbsp;или&nbsp;30&nbsp;саше?","answer":"15&nbsp;саше&nbsp;— чтобы попробовать продукт и&nbsp;выбрать любимый вкус. 30&nbsp;саше&nbsp;— на&nbsp;месяц ежедневного приёма: по&nbsp;одному саше в&nbsp;день."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-2","expanded":"false","question":"Как&nbsp;принимать коллаген?","answer":"Принимайте по&nbsp;одному саше в&nbsp;день за&nbsp;40&nbsp;минут до&nbsp;еды. Содержимое можно запить водой или&nbsp;растворить в&nbsp;150–200&nbsp;мл&nbsp;воды. Рекомендованный курс&nbsp;— не&nbsp;менее трёх месяцев."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-3","state":"is-open","expanded":"true","question":"Нужно&nbsp;ли&nbsp;хранить саше в&nbsp;холодильнике?","answer":"При&nbsp;температуре от&nbsp;0&nbsp;до +4&nbsp;°C&nbsp;срок годности составляет 12&nbsp;месяцев, а&nbsp;при&nbsp;температуре от&nbsp;0&nbsp;до +20&nbsp;°C&nbsp;— не&nbsp;более 6&nbsp;месяцев с&nbsp;даты изготовления. После получения рекомендуем хранить коллаген в&nbsp;холодильнике."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-4","expanded":"false","question":"Есть&nbsp;ли&nbsp;у&nbsp;коллагена рыбный вкус или&nbsp;запах?","answer":"Коллаген изготовлен из&nbsp;атлантической трески. Вкусовые ощущения индивидуальны: кто-то замечает морские нотки, а&nbsp;кто-то нет. В&nbsp;составе нет ароматизаторов и&nbsp;добавленного сахара."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-5","expanded":"false","question":"Какие вкусы есть у&nbsp;ArcticBerries?","answer":"Пять ягодных вкусов: морошка, черника, клюква, голубика и&nbsp;брусника."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-6","expanded":"false","question":"Есть&nbsp;ли&nbsp;скидка на&nbsp;курс?","answer":"Бонусная программа пока не&nbsp;предусмотрена. Если у&nbsp;вас есть промокод, введите его в&nbsp;корзине перед оплатой."}'></include>
        </div>
      </section>

      <section class="help__group" id="help-delivery" aria-labelledby="help-delivery-title">
        <h2 class="help__group-title" id="help-delivery-title" data-js-title-reveal>Доставка</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-1","expanded":"false","question":"Куда вы&nbsp;доставляете?","answer":"По&nbsp;всей России. Все заказы отправляем из&nbsp;Мурманска&nbsp;— прямо с&nbsp;производства."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-2","expanded":"false","question":"Нужно&nbsp;ли&nbsp;регистрироваться, чтобы сделать заказ?","answer":"Нет, заказ можно оформить без&nbsp;регистрации. В&nbsp;личном кабинете удобнее следить за&nbsp;статусами и&nbsp;историей заказов, а&nbsp;также сохранять адреса."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-3","expanded":"false","question":"Какие способы доставки есть?","answer":"Вы&nbsp;можете выбрать СДЭК или&nbsp;Ozon. Если возникнут сложности, напишите нам&nbsp;— менеджер подскажет."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-4","expanded":"false","question":"Сколько стоит доставка?","answer":"Стоимость рассчитывается автоматически и&nbsp;зависит от&nbsp;города, способа доставки и&nbsp;веса заказа. Итоговую сумму вы&nbsp;увидите до&nbsp;оплаты."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-5","expanded":"false","question":"Как&nbsp;быстро вы&nbsp;отправляете заказ?","answer":"Собираем и&nbsp;передаём заказ в&nbsp;службу доставки в&nbsp;течение 1–2&nbsp;рабочих дней после оплаты. Заказу автоматически присваивается трек-номер."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-6","expanded":"false","question":"Сколько идёт доставка?","answer":"Срок зависит от&nbsp;города и&nbsp;службы доставки. Расчётную дату вы&nbsp;увидите при&nbsp;оформлении заказа."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-7","expanded":"false","question":"Не&nbsp;испортится&nbsp;ли&nbsp;коллаген в&nbsp;дороге без&nbsp;холодильника?","answer":"Несколько дней в&nbsp;пути продукт переносит нормально. После получения рекомендуем убрать саше в&nbsp;холодильник: так они дольше сохранятся, а&nbsp;охлаждённый гель приятнее на&nbsp;вкус."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-8","expanded":"false","question":"Как&nbsp;отследить заказ?","answer":"Трек-номер появится после оформления отправления. По&nbsp;нему можно отследить посылку на&nbsp;сайте службы доставки. Если у&nbsp;вас есть личный кабинет, статус заказа будет доступен и&nbsp;там."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-9","expanded":"false","question":"Что&nbsp;будет, если я&nbsp;не&nbsp;успею забрать заказ из&nbsp;пункта выдачи?","answer":"Срок хранения определяет служба доставки. Часто его можно продлить в&nbsp;приложении или&nbsp;на&nbsp;сайте. Если посылка вернётся к&nbsp;нам, напишите&nbsp;— согласуем повторную отправку."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-10","expanded":"false","question":"Можно&nbsp;ли&nbsp;отправить ArcticBerries в&nbsp;подарок?","answer":"Да. Укажите при&nbsp;оформлении имя, телефон и&nbsp;адрес получателя. Чек придёт на&nbsp;вашу электронную почту."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-11","expanded":"false","question":"Что&nbsp;проверить при&nbsp;получении?","answer":"Проверьте целостность упаковки и&nbsp;комплектность заказа до&nbsp;ухода из&nbsp;пункта выдачи или&nbsp;отъезда курьера. Если есть повреждения или&nbsp;протечки, зафиксируйте их&nbsp;вместе с&nbsp;сотрудником службы доставки и&nbsp;пришлите нам фото."}'></include>
        </div>
      </section>

      <section class="help__group" id="help-payment" aria-labelledby="help-payment-title">
        <h2 class="help__group-title" id="help-payment-title" data-js-title-reveal>Оплата</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-1","expanded":"false","question":"Как&nbsp;можно оплатить заказ?","answer":"Онлайн при&nbsp;оформлении заказа&nbsp;— банковской картой или&nbsp;через СБП. Перед оплатой вы&nbsp;увидите полную сумму с&nbsp;доставкой."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-2","expanded":"false","question":"Можно&nbsp;ли&nbsp;оплатить при&nbsp;получении?","answer":"Пока нет. Мы&nbsp;принимаем оплату только онлайн на&nbsp;сайте."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-3","expanded":"false","question":"Безопасно&nbsp;ли&nbsp;платить на&nbsp;сайте?","answer":"Да. Оплата проходит на&nbsp;защищённой странице платёжного сервиса LifePay. Данные карты вводятся там: мы&nbsp;их&nbsp;не&nbsp;видим и&nbsp;не&nbsp;храним."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-4","expanded":"false","question":"Когда спишутся деньги?","answer":"В&nbsp;момент оплаты заказа. Если заказ отменён до&nbsp;передачи в&nbsp;доставку, вернём деньги тем&nbsp;же&nbsp;способом, которым вы&nbsp;платили."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-5","expanded":"false","question":"Я&nbsp;получу чек?","answer":"Да, электронный кассовый чек придёт на&nbsp;почту или&nbsp;телефон, указанные при&nbsp;оформлении. Если не&nbsp;нашли чек, проверьте спам или&nbsp;напишите нам."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-6","expanded":"false","question":"Есть&nbsp;ли&nbsp;бонусы и&nbsp;промокоды?","answer":"Бонусной системы пока нет. Если у&nbsp;вас есть промокод, введите его в&nbsp;корзине."}'></include>
        </div>
      </section>

      <section class="help__group" id="help-returns" aria-labelledby="help-returns-title">
        <h2 class="help__group-title" id="help-returns-title" data-js-title-reveal>Возврат</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-1","expanded":"false","question":"Можно&nbsp;ли&nbsp;отменить заказ?","answer":"Да. Пока заказ не&nbsp;передан в&nbsp;службу доставки, напишите нам&nbsp;— вернём оплату полностью."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-2","expanded":"false","question":"Можно&nbsp;ли&nbsp;вернуть продукт, если он&nbsp;не&nbsp;подошёл?","answer":"ArcticBerries&nbsp;— пищевая продукция. Возврат товара надлежащего качества после получения не&nbsp;предусмотрен. Если с&nbsp;заказом что-то не&nbsp;так, напишите нам&nbsp;— разберёмся в&nbsp;ситуации."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-3","expanded":"false","question":"Что&nbsp;делать, если пришёл повреждённый товар?","answer":"Сфотографируйте посылку, коробку и&nbsp;повреждения, затем напишите нам и&nbsp;укажите номер заказа. Мы&nbsp;проверим ситуацию и&nbsp;предложим замену товара или&nbsp;возврат денег."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-4","expanded":"false","question":"Что&nbsp;делать, если прислали не&nbsp;тот вкус или&nbsp;чего-то не&nbsp;хватает?","answer":"Напишите нам номер заказа и, по&nbsp;возможности, приложите фото упаковки и&nbsp;содержимого. Исправим ошибку за&nbsp;свой счёт: дошлём недостающее или&nbsp;заменим товар."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-5","expanded":"false","question":"Что&nbsp;делать, если срок годности истёк или&nbsp;подходит к&nbsp;концу?","answer":"Мы&nbsp;отправляем продукцию прямо с&nbsp;производства. Если срок годности уже истёк, заменим товар или&nbsp;вернём деньги. Если срок только подходит к&nbsp;концу и&nbsp;вас это беспокоит, свяжитесь с&nbsp;нами&nbsp;— проверим информацию по&nbsp;партии."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-6","expanded":"false","question":"Как&nbsp;и&nbsp;когда вернутся деньги?","answer":"Оформляем возврат не&nbsp;позднее 10&nbsp;дней с&nbsp;момента обращения. Деньги возвращаются тем&nbsp;же&nbsp;способом, которым вы&nbsp;платили. Срок зачисления зависит от&nbsp;банка."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-7","expanded":"false","question":"Как&nbsp;с&nbsp;вами связаться?","answer":"Напишите на&nbsp;arcticbiomarine@yandex.ru&nbsp;или&nbsp;в&nbsp;Telegram по&nbsp;номеру +7&nbsp;921&nbsp;153-35-53. Укажите номер заказа и&nbsp;телефон или&nbsp;почту, оставленные при&nbsp;оформлении."}'></include>
        </div>
      </section>
    </div>
  </div>
</section>

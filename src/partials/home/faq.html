        <include src="partials/accordion-item.html" data='{"id":"faq-1","expanded":"false","question":"Какую упаковку выбрать: 15&nbsp;или&nbsp;30&nbsp;саше?","answer":"15&nbsp;саше&nbsp;— формат на&nbsp;15&nbsp;дней, чтобы познакомиться с&nbsp;продуктом. 30&nbsp;саше&nbsp;— упаковка на&nbsp;30&nbsp;дней ежедневного приёма. Рекомендуемый курс&nbsp;— не&nbsp;менее 3&nbsp;месяцев, по&nbsp;одному саше в&nbsp;день."}'></include>
        <include src="partials/accordion-item.html" data='{"id":"faq-2","state":"is-open","expanded":"true","question":"Как&nbsp;принимать коллаген?","answer":"Принимайте по&nbsp;одному саше в&nbsp;день за&nbsp;40&nbsp;минут до&nbsp;еды. Содержимое можно употребить сразу, запив водой, или&nbsp;растворить в&nbsp;150–200&nbsp;мл&nbsp;воды. Рекомендуемый курс непрерывного приёма&nbsp;— не&nbsp;менее 3&nbsp;месяцев."}'></include>
        <include src="partials/accordion-item.html" data='{"id":"faq-3","expanded":"false","question":"Нужно&nbsp;ли&nbsp;хранить саше в&nbsp;холодильнике?","answer":"При&nbsp;температуре от&nbsp;0&nbsp;до +4&nbsp;°C&nbsp;срок хранения составляет 12&nbsp;месяцев, при&nbsp;температуре до +20&nbsp;°C&nbsp;— не&nbsp;более 6&nbsp;месяцев с&nbsp;даты изготовления. Храните продукт в&nbsp;сухом месте, вдали от&nbsp;солнечных лучей. После доставки рекомендуем убрать саше в&nbsp;холодильник."}'></include>
        <include src="partials/accordion-item.html" data='{"id":"faq-4","expanded":"false","question":"Есть&nbsp;ли&nbsp;в&nbsp;коллагене вкус или&nbsp;запах рыбы?","answer":"Нет, у&nbsp;коллагена нет характерного рыбного вкуса и&nbsp;запаха. В&nbsp;составе&nbsp;— пептиды морского коллагена и&nbsp;натуральные северные ягоды, которые придают продукту ягодный вкус."}'></include>
        <include src="partials/accordion-item.html" data='{"id":"faq-5","expanded":"false","question":"Сколько занимает доставка?","answer":"Отправляем заказы из&nbsp;Мурманска по&nbsp;всей России через СДЭК или&nbsp;Ozon. Передаём заказ в&nbsp;доставку в&nbsp;течение 1–2&nbsp;рабочих дней после оплаты. Расчётный срок доставки до&nbsp;вашего города появится при&nbsp;оформлении заказа."}'></include>
        <include src="partials/accordion-item.html" data='{"id":"faq-6","expanded":"false","question":"Можно&nbsp;ли&nbsp;вернуть заказ?","answer":"Если заказ ещё не&nbsp;передан в&nbsp;доставку, напишите нам&nbsp;— отменим его и&nbsp;вернём деньги. Если товар пришёл повреждённым, с&nbsp;истёкшим сроком годности или&nbsp;вы&nbsp;получили не&nbsp;тот товар, сообщите номер заказа и&nbsp;приложите фото. Мы&nbsp;поможем оформить замену или&nbsp;возврат денег."}'></include>
        <include src="partials/accordion-item.html" data='{"id":"faq-7","expanded":"false","question":"Есть&nbsp;ли&nbsp;скидка на&nbsp;курс?","answer":"Если у&nbsp;вас есть промокод, введите его в&nbsp;корзине перед оплатой. Бонусной программы сейчас нет. Актуальная стоимость каждой упаковки и&nbsp;набора указана на&nbsp;сайте."}'></include>

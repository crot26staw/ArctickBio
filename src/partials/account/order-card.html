<!-- Заказ в списке «Мои заказы» (макет 16692:131077). Ссылка — на страницу заказа (WooCommerce view-order), растянута на всю карточку -->
<li class="order-card woocommerce-orders-table__row">
  <div class="order-card__head">
    <p class="order-card__number"><span>{{ number }}</span> <span class="order-card__date">от {{ date }}</span></p>
    <a class="order-card__status" href="./order.html">{{ status }}
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8.4 8L5.33333 4.93333L6.26667 4L10.2667 8L6.26667 12L5.33333 11.0667L8.4 8Z"/></svg>
    </a>
  </div>
  <div class="order-card__body">
    <span class="order-card__thumb">
      <img src="./assets/images/checkout-product.webp" alt="" width="64" height="48" loading="lazy">
    </span>
    <p class="order-card__info">
      <span class="order-card__label">Состав заказа</span>
      <span class="order-card__value">{{ count }}</span>
    </p>
    <p class="order-card__info order-card__info--end">
      <span class="order-card__label">Сумма</span>
      <span class="order-card__value">{{ total }}</span>
    </p>
  </div>
</li>

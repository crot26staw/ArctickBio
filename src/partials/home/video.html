<section class="video" data-header-theme="dark" data-js-cursor-follow-area>
  <div class="video__bg" aria-hidden="true">
    <img src="./assets/images/video-bg.webp" alt="" width="2880" height="1622" loading="lazy">
  </div>
  <img class="video__light" src="./assets/images/video-light.webp" alt="" width="1920" height="1088" loading="lazy" aria-hidden="true">

  <!-- Следует за курсором в пределах блока (js/modules/cursor-follow.js) -->
  <button class="video__play" type="button" data-js-video-open data-js-swipe data-js-cursor-follow>
    <img src="./assets/icons/icn-play.svg" alt="" width="12" height="12">
    Смотреть (2:35)
  </button>

  <div class="video__inner container">
    <h2 class="video__title" data-js-title-reveal>Мы собираем ягоды <br>в экологически чистых местах Кольского полуострова</h2>

    <button class="video__card" type="button" data-js-fade-up data-js-video-open data-swipe-trigger>
      <img class="video__card-img" src="./assets/images/video-card.webp" alt="" width="900" height="900" loading="lazy">
      <span class="video__card-label">
        Смотреть (2:35)
        <span class="icon-btn icon-btn--24" data-js-swipe>
          <img src="./assets/icons/icn-play-18.svg" alt="" width="18" height="18">
        </span>
      </span>
    </button>
  </div>
</section>

<section class="help" data-header-theme="dark">
  <div class="help__bg" aria-hidden="true">
    <img src="./assets/images/buyers-bg.webp" alt="" width="936" height="1024" fetchpriority="high">
  </div>

  <div class="help__intro">
    <p class="help__lead" data-js-title-reveal data-title-reveal-start="top bottom">Условия покупки <br>и&nbsp;работы с&nbsp;данными</p>
    <p class="help__title" data-js-title-reveal data-title-reveal-start="top bottom">Документы</p>
  </div>

  <!-- Панель документов: разметка «Покупателям». Каждый документ — своя страница, в меню — ссылки на них,
       у текущей is-active + aria-current (data: <slug>-active / <slug>-current); на планшете/мобилке к ней подкручиваются вкладки — js/modules/anchor-nav.js -->
  <div class="help__panel" data-header-theme="light">
    <aside class="help__aside">
      <nav aria-label="Документы">
        <ul class="help__menu" data-js-anchor-nav>
          <li><a class="help__link{{ oferta-active }}" href="./oferta.html"{{ oferta-current }} data-js-roll>Публичная оферта</a></li>
          <li><a class="help__link{{ privacy-active }}" href="./privacy.html"{{ privacy-current }} data-js-roll>Политика конфиденциальности</a></li>
          <li><a class="help__link{{ cookie-active }}" href="./cookie.html"{{ cookie-current }} data-js-roll>Политика cookie</a></li>
          <li><a class="help__link{{ agreement-active }}" href="./agreement.html"{{ agreement-current }} data-js-roll>Пользовательское соглашение</a></li>
          <li><a class="help__link{{ personal-data-active }}" href="./personal-data.html"{{ personal-data-current }} data-js-roll>Согласие на&nbsp;обработку данных</a></li>
          <li><a class="help__link{{ marketing-active }}" href="./marketing.html"{{ marketing-current }} data-js-roll>Согласие на&nbsp;рассылки</a></li>
        </ul>
      </nav>
      <p class="help__note">Остались вопросы по&nbsp;документам? <a href="./contacts.html">Напишите</a> нам&nbsp;— ответим в&nbsp;кратчайшие сроки.</p>
    </aside>

    <div class="help__content">
      <include src="partials/documents/{{ slug }}.html"></include>
    </div>
  </div>
</section>

<section class="hero" data-header-theme="dark" data-js-hero-cover>
  <div class="hero__bg" aria-hidden="true">
    <picture>
      <source media="(max-width: 767px)" srcset="./assets/images/hero-bg-mobile.webp" width="750" height="1621">
      <img src="./assets/images/hero-bg.webp" alt="" width="1672" height="941" fetchpriority="high">
    </picture>
    <video class="hero__video" src="./assets/video/hero.mp4" width="1920" height="1080" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
  </div>
  <div class="hero__inner container" data-js-hero-cover-parallax>
    <div class="hero__content">
      <h1 class="hero__title" data-js-title-reveal>Коллаген из дикой трески <span class="hero__title-accent">Баренцева моря</span></h1>
      <p class="hero__text" data-js-title-reveal data-title-reveal-start="top bottom">АрктикБиоМарин® это поддержка кожи, суставов и волос, природным коллагеном без добавок</p>
    </div>
    <div class="hero__products swiper" data-js-product-slider data-js-fade-up data-fade-up-delay="0.6" data-fade-up-start="top bottom">
      <ul class="hero__products-list products swiper-wrapper">
        <li class="hero__product product swiper-slide">
          <include src="partials/mini-card.html" data='{"title": "Морской коллаген", "subtitle": "с дикой брусникой", "price": "1440₽", "link": "#", "id": "1", "mod": "mini-card--bare"}'></include>
        </li>
        <li class="hero__product product swiper-slide">
          <include src="partials/mini-card.html" data='{"title": "Морской коллаген", "subtitle": "с дикой черникой", "price": "1440₽", "link": "#", "id": "2", "mod": "mini-card--bare"}'></include>
        </li>
        <li class="hero__product product swiper-slide">
          <include src="partials/mini-card.html" data='{"title": "Морской коллаген", "subtitle": "с дикой голубикой", "price": "1440₽", "link": "#", "id": "3", "mod": "mini-card--bare"}'></include>
        </li>
        <li class="hero__product product swiper-slide">
          <include src="partials/mini-card.html" data='{"title": "Морской коллаген", "subtitle": "с дикой клюквой", "price": "1440₽", "link": "#", "id": "4", "mod": "mini-card--bare"}'></include>
        </li>
        <li class="hero__product product swiper-slide">
          <include src="partials/mini-card.html" data='{"title": "Морской коллаген", "subtitle": "с дикой морошкой", "price": "1440₽", "link": "#", "id": "5", "mod": "mini-card--bare"}'></include>
        </li>
      </ul>
      <div class="hero__products-dots" data-js-product-slider-pagination></div>
    </div>
  </div>
  <div class="hero__shade" aria-hidden="true" data-js-hero-cover-shade></div>
</section>

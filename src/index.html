<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АрктикБиоМарин — морской коллаген из дикой трески Баренцева моря</title>
  <meta name="description" content="АрктикБиоМарин — природный морской коллаген из дикой трески Баренцева моря с северными ягодами. Поддержка кожи, суставов и волос.">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preload" href="./assets/fonts/Involve-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./scss/main.scss">
</head>
<body class="page">
  <include src="partials/header.html"></include>

  <main class="main">
    <include src="partials/home/hero.html"></include>
    <!-- Внешняя обёртка: в конце закрепляется, и catalog наезжает на product-scene (js/modules/sachet-journey.js, фаза 3).
         Отдельный элемент — второй pin на .sachet-journey ломает её первый pin -->
    <div class="sachet-journey-cover" data-js-sachet-journey-cover>
    <!-- Стик «перелетает» из блока about в пачку product-scene при скролле (js/modules/sachet-journey.js) -->
    <div class="sachet-journey" data-js-sachet-journey>
      <!-- Облачная завеса: в конце пина about поднимается над ним, product-scene выходит из неё (js/modules/sachet-journey.js) -->
      <div class="cloud-veil" aria-hidden="true" data-js-cloud-veil>
        <img class="cloud-veil__clouds" src="./assets/images/about-clouds.webp" alt="" width="648" height="405" loading="lazy">
        <div class="cloud-veil__fill"></div>
        <div class="cloud-veil__theme" data-header-theme="light"></div>
      </div>
      <include src="partials/home/about.html"></include>
      <include src="partials/home/product-scene.html"></include>
      <div class="sachet-journey__sachet" data-js-sachet-journey-item>
        <img src="./assets/images/sachet.webp" alt="" width="820" height="1024" loading="lazy" data-js-sachet-journey-img>
      </div>
    </div>
    </div>
    <include src="partials/home/catalog.html"></include>
    <include src="partials/home/compound-stats.html"></include>
    <!-- video наезжает сверху на закреплённый compound (scss/blocks/_overlap-stack.scss) -->
    <div class="overlap-stack">
      <include src="partials/home/compound.html"></include>
      <include src="partials/home/video.html"></include>
    </div>
    <include src="partials/home/research.html"></include>
    <include src="partials/home/production.html"></include>
    <include src="partials/home/comparison.html"></include>
    <include src="partials/home/usage.html"></include>
    <include src="partials/home/benefits.html"></include>
    <include src="partials/home/catalog.html"></include>
    <include src="partials/home/faq.html"></include>
    <include src="partials/home/reviews.html"></include>
  </main>

  <include src="partials/footer.html"></include>

  <script type="module" src="./js/main.js"></script>
</body>
</html>

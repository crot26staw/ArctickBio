<article class="mini-card {{ mod }}">
  <a class="mini-card__media" href="{{ link }}" tabindex="-1" aria-hidden="true">
    <span class="mini-card__img-wrap">
      <img class="mini-card__img" src="./assets/images/product-{{ flavor }}-mini.webp" alt="" width="240" height="186" loading="lazy">
    </span>
    <span class="mini-card__dots">
      <span class="mini-card__dot is-active"></span>
      <span class="mini-card__dot"></span>
      <span class="mini-card__dot"></span>
    </span>
  </a>
  <div class="mini-card__body">
    <div class="mini-card__text">
      <a class="mini-card__title" href="{{ link }}">{{ title }}</a>
      <p class="mini-card__subtitle">{{ subtitle }}</p>
    </div>
    <div class="mini-card__actions">
      <button class="mini-card__add icon-btn icon-btn--24 icon-btn--light add_to_cart_button" type="button" aria-label="Добавить в корзину" data-product_id="{{ id }}" data-js-swipe>
        <img src="./assets/icons/icn-add.svg" alt="" width="18" height="18">
      </button>
      <span class="mini-card__price price">{{ price }}</span>
    </div>
  </div>
</article>

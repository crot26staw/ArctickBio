<li class="team-card">
  <img class="team-card__img" src="{{ img }}" alt="{{ name }}" width="736" height="920" loading="lazy">
  <div class="team-card__info">
    <p class="team-card__job">{{ job }}</p>
    <div>
      <p class="team-card__name">{{ name }}</p>
      <p class="team-card__exp">{{ exp }}</p>
    </div>
  </div>
</li>

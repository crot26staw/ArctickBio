<li class="media__item">
  <a class="media-card" href="{{ link }}" target="_blank" rel="noopener" data-js-fake-glass-item data-swipe-trigger>
    <span class="media-card__header">
      <span class="media-card__title">{{ title }}</span>
      <img class="media-card__chevron" src="./assets/icons/icn-chevron.svg" alt="" width="24" height="24">
    </span>
    <span class="media-card__icon-wrap">
      <span class="media-card__icon" data-js-swipe><img src="{{ icon }}" alt="" width="56" height="56"></span>
    </span>
  </a>
</li>

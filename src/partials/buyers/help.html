    <h1 class="help__title" data-js-title-reveal data-title-reveal-start="top bottom">Покупателям</h1>
  </div>

  <!-- Панель вопросов: меню разделов прилипает при скролле, активный раздел — js/modules/anchor-nav.js -->
  <div class="help__panel" data-header-theme="light">

      <nav aria-label="Разделы">
        <ul class="help__menu" data-js-anchor-nav>
          <li><a class="help__link is-active" href="#help-general" aria-current="true" data-js-roll>Общие вопросы</a></li>

      <p class="help__note">Не&nbsp;нашли ответы на&nbsp;свои вопросы? <a href="#">Напишите</a> нам, и&nbsp;мы&nbsp;ответим вам в&nbsp;кратчайшие сроки.</p>

    <div class="help__content" data-js-accordion-group>
      <section class="help__group" id="help-general" aria-labelledby="help-general-title">
        <h2 class="help__group-title" id="help-general-title" data-js-title-reveal>Общие вопросы</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-1","expanded":"false","question":"Какую упаковку выбрать: 15&nbsp;или&nbsp;30&nbsp;саше?","answer":"15&nbsp;саше&nbsp;— чтобы попробовать продукт и&nbsp;выбрать любимый вкус. 30&nbsp;саше&nbsp;— на&nbsp;месяц ежедневного приёма: по&nbsp;одному саше в&nbsp;день."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-2","expanded":"false","question":"Как&nbsp;принимать коллаген?","answer":"Принимайте по&nbsp;одному саше в&nbsp;день за&nbsp;40&nbsp;минут до&nbsp;еды. Содержимое можно запить водой или&nbsp;растворить в&nbsp;150–200&nbsp;мл&nbsp;воды. Рекомендованный курс&nbsp;— не&nbsp;менее трёх месяцев."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-3","state":"is-open","expanded":"true","question":"Нужно&nbsp;ли&nbsp;хранить саше в&nbsp;холодильнике?","answer":"При&nbsp;температуре от&nbsp;0&nbsp;до +4&nbsp;°C&nbsp;срок годности составляет 12&nbsp;месяцев, а&nbsp;при&nbsp;температуре от&nbsp;0&nbsp;до +20&nbsp;°C&nbsp;— не&nbsp;более 6&nbsp;месяцев с&nbsp;даты изготовления. После получения рекомендуем хранить коллаген в&nbsp;холодильнике."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-4","expanded":"false","question":"Есть&nbsp;ли&nbsp;у&nbsp;коллагена рыбный вкус или&nbsp;запах?","answer":"Коллаген изготовлен из&nbsp;атлантической трески. Вкусовые ощущения индивидуальны: кто-то замечает морские нотки, а&nbsp;кто-то нет. В&nbsp;составе нет ароматизаторов и&nbsp;добавленного сахара."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-5","expanded":"false","question":"Какие вкусы есть у&nbsp;ArcticBerries?","answer":"Пять ягодных вкусов: морошка, черника, клюква, голубика и&nbsp;брусника."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-general-6","expanded":"false","question":"Есть&nbsp;ли&nbsp;скидка на&nbsp;курс?","answer":"Бонусная программа пока не&nbsp;предусмотрена. Если у&nbsp;вас есть промокод, введите его в&nbsp;корзине перед оплатой."}'></include>
        </div>
      </section>

      <section class="help__group" id="help-delivery" aria-labelledby="help-delivery-title">
        <h2 class="help__group-title" id="help-delivery-title" data-js-title-reveal>Доставка</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-1","expanded":"false","question":"Куда вы&nbsp;доставляете?","answer":"По&nbsp;всей России. Все заказы мы&nbsp;отправляем из&nbsp;Мурманска, так что&nbsp;коробка едет к&nbsp;вам прямо с&nbsp;производства."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-2","expanded":"false","question":"Нужно&nbsp;ли&nbsp;регистрироваться, чтобы сделать заказ?","answer":"Нет, заказ можно оформить и&nbsp;без&nbsp;регистрации. В&nbsp;личном кабинете просто удобнее: там видны история и&nbsp;статусы заказов, сохраняются адреса."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-3","expanded":"false","question":"Какие способы доставки есть?","answer":"Вы&nbsp;выбираете удобный для&nbsp;вас сервис: СДЭК или&nbsp;Озон. Если возникли трудности, вы&nbsp;всегда можете написать нам, и&nbsp;менеджер вам подскажет."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-4","expanded":"false","question":"Сколько стоит доставка?","answer":"Сайт считает её&nbsp;автоматически: стоимость зависит от&nbsp;города, способа доставки и&nbsp;веса заказа, и&nbsp;точную сумму вы&nbsp;увидите до&nbsp;оплаты."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-5","expanded":"false","question":"Как&nbsp;быстро вы&nbsp;отправляете заказ?","answer":"Собираем и&nbsp;передаём заказ в&nbsp;службу доставки в&nbsp;течение 1–2&nbsp;рабочих дней после оплаты. Трек-номер присваивается автоматически."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-6","expanded":"false","question":"Сколько идёт доставка?","answer":"Зависит от&nbsp;города и&nbsp;службы доставки, точный расчётный срок вы&nbsp;увидите при&nbsp;оформлении."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-7","expanded":"false","question":"Не&nbsp;испортится&nbsp;ли&nbsp;коллаген в&nbsp;дороге без&nbsp;холодильника?","answer":"Нет. Несколько дней в&nbsp;пути ему не&nbsp;страшны. Когда заберёте посылку, уберите коробку в&nbsp;холодильник: так она дольше сохранится, да&nbsp;и&nbsp;холодным гель вкуснее."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-8","expanded":"false","question":"Как&nbsp;отследить заказ?","answer":"После оплаты в&nbsp;личном кабинете отобразится трек-номер, по&nbsp;нему виден статус на&nbsp;сайте службы доставки. Если вы&nbsp;зарегистрированы, статус заказа отображается и&nbsp;в&nbsp;личном кабинете."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-9","expanded":"false","question":"Что&nbsp;будет, если я&nbsp;не&nbsp;успею забрать заказ из&nbsp;пункта выдачи?","answer":"Срок хранения устанавливает служба доставки, и&nbsp;часто его можно продлить в&nbsp;приложении или&nbsp;на&nbsp;сайте доставки. Если срок закончится, посылка вернётся к&nbsp;нам. Тогда напишите нам, и&nbsp;мы&nbsp;договоримся о&nbsp;повторной отправке."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-10","expanded":"false","question":"Можно&nbsp;ли&nbsp;отправить ArcticBerries в&nbsp;подарок?","answer":"Да. При&nbsp;оформлении укажите имя, телефон и&nbsp;адрес получателя, а&nbsp;чек придёт на&nbsp;вашу почту."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-delivery-11","expanded":"false","question":"Что&nbsp;проверить при&nbsp;получении?","answer":"Перед тем как&nbsp;уйти из&nbsp;пункта выдачи, проверьте, что&nbsp;упаковка цела и&nbsp;в&nbsp;заказе всё на&nbsp;месте.<br>Если целостность упаковки нарушена или&nbsp;что-то протекло, зафиксируйте это вместе с&nbsp;сотрудником службы доставки и&nbsp;напишите нам, приложив фото."}'></include>
        </div>
      </section>

      <section class="help__group" id="help-payment" aria-labelledby="help-payment-title">
        <h2 class="help__group-title" id="help-payment-title" data-js-title-reveal>Оплата</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-1","expanded":"false","question":"Как&nbsp;можно оплатить заказ?","answer":"Онлайн при&nbsp;оформлении заказа: банковской картой или&nbsp;через СБП. Перед оплатой вы&nbsp;увидите итоговую сумму вместе с&nbsp;доставкой."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-2","expanded":"false","question":"Можно&nbsp;ли&nbsp;оплатить при&nbsp;получении?","answer":"Пока нет, мы&nbsp;принимаем только онлайн-оплату на&nbsp;сайте, так заказ сразу уходит в&nbsp;сборку."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-3","expanded":"false","question":"Безопасно&nbsp;ли&nbsp;платить на&nbsp;сайте?","answer":"Да. Оплата проходит на&nbsp;защищённой странице Альфа-Банка: данные карты вводятся там, и&nbsp;мы&nbsp;их&nbsp;не&nbsp;видим и&nbsp;не&nbsp;храним."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-4","expanded":"false","question":"Когда спишутся деньги?","answer":"В&nbsp;момент оплаты. Если заказ отменится до&nbsp;его передачи в&nbsp;доставку, вернём деньги тем&nbsp;же&nbsp;способом, которым вы&nbsp;платили."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-5","expanded":"false","question":"Я&nbsp;получу чек?","answer":"Да, электронный кассовый чек придёт на&nbsp;почту или&nbsp;телефон, которые вы&nbsp;указали при&nbsp;оформлении. Если не&nbsp;нашли его, загляните в&nbsp;спам или&nbsp;напишите нам, пришлём повторно."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-payment-6","expanded":"false","question":"Есть&nbsp;ли&nbsp;бонусы и&nbsp;промокоды?","answer":"Бонусная система пока не&nbsp;предусмотрена. Промокод, если он&nbsp;у&nbsp;вас есть, вводится в&nbsp;корзине."}'></include>
        </div>
      </section>

      <section class="help__group" id="help-returns" aria-labelledby="help-returns-title">
        <h2 class="help__group-title" id="help-returns-title" data-js-title-reveal>Возврат</h2>
        <div class="help__list">
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-1","expanded":"false","question":"Можно&nbsp;ли&nbsp;отменить заказ?","answer":"Да. Пока заказ не&nbsp;передан в&nbsp;доставку, напишите нам, и&nbsp;мы&nbsp;вернём деньги полностью."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-2","expanded":"false","question":"Можно&nbsp;ли&nbsp;вернуть продукт, если он&nbsp;не&nbsp;подошёл?","answer":"ArcticBerries относится к&nbsp;пищевой продукции, поэтому вернуть его нельзя. Возврат допустим в&nbsp;случае повреждения упаковки. А&nbsp;если просто не&nbsp;подошёл вкус, напишите нам, подскажем, какую ягоду попробовать следующей."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-3","expanded":"false","question":"Что&nbsp;делать, если пришёл повреждённый товар?","answer":"Сфотографируйте посылку, коробку и&nbsp;повреждение сразу после получения и&nbsp;напишите нам, приложив фото и&nbsp;номер заказа. Мы&nbsp;проверим ситуацию и&nbsp;заменим товар или&nbsp;вернём деньги, как&nbsp;вам будет удобнее."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-4","expanded":"false","question":"Что&nbsp;если в&nbsp;заказе не&nbsp;тот вкус или&nbsp;чего-то не&nbsp;хватает?","answer":"Напишите нам и&nbsp;укажите номер заказа, по&nbsp;возможности приложите фото содержимого и&nbsp;упаковки. Ошибку исправим за&nbsp;свой счёт: дошлём недостающее или&nbsp;заменим вкус."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-5","expanded":"false","question":"Что&nbsp;если срок годности истёк или&nbsp;подходит к&nbsp;концу?","answer":"Мы&nbsp;отправляем свежую продукцию прямо с&nbsp;производства. Если вам всё&nbsp;же&nbsp;пришёл продукт с&nbsp;истёкшим сроком, это наша ошибка: заменим его или&nbsp;вернём деньги."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-6","expanded":"false","question":"Как&nbsp;и&nbsp;когда вернутся деньги?","answer":"Оформляем возврат не&nbsp;позднее 10&nbsp;дней с&nbsp;момента, как&nbsp;вы&nbsp;к&nbsp;нам обратились, деньги вернутся тем&nbsp;же&nbsp;способом, которым вы&nbsp;платили. Сколько они будут идти до&nbsp;карты, зависит от&nbsp;вашего банка."}'></include>
          <include src="partials/accordion-item.html" data='{"mod":"accordion--line","id":"help-returns-7","expanded":"false","question":"Как&nbsp;с&nbsp;вами связаться?","answer":"Пишите на&nbsp;arcticbiomarine@yandex.ru&nbsp;или&nbsp;в&nbsp;Telegram: +7&nbsp;921&nbsp;153-35-53. Чтобы мы&nbsp;быстрее нашли заказ, укажите его номер и&nbsp;телефон или&nbsp;почту, которые оставляли при&nbsp;оформлении."}'></include>
        </div>
      </section>
    </div>
  </div>
</section>

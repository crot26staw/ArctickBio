<section class="video" data-header-theme="dark" data-js-cursor-follow-area data-js-video>
  <!-- Фон — превью без звука, по кругу; грузится и играет, только когда блок рядом с экраном (js/modules/video.js) -->
  <div class="video__bg" aria-hidden="true">
    <video src="./assets/video/video-preview.mp4" poster="./assets/images/video-bg.webp" width="1920" height="1080" muted loop playsinline preload="none" data-js-video-preview></video>
  </div>
  <img class="video__light" src="./assets/images/video-light.webp" alt="" width="1920" height="1088" loading="lazy" aria-hidden="true">

  <!-- Следует за курсором в пределах блока (js/modules/cursor-follow.js) -->
  <button class="video__play" type="button" data-js-video-open data-js-swipe data-js-cursor-follow>
    <img src="./assets/icons/icn-play.svg" alt="" width="12" height="12">
    Смотреть (0:42)
  </button>

  <div class="video__inner container">
    <h2 class="video__title" data-js-title-reveal>Мы&nbsp;собираем ягоды <br>в&nbsp;экологически чистых местах Кольского полуострова</h2>

    <button class="video__card" type="button" data-js-fade-up data-js-video-open data-js-video-card data-swipe-trigger>
      <img class="video__card-img" src="./assets/images/video-card.webp" alt="" width="900" height="900" loading="lazy">
      <span class="video__card-label">
        Смотреть (0:42)
        <span class="icon-btn icon-btn--24" data-js-swipe>
          <img src="./assets/icons/icn-play-18.svg" alt="" width="18" height="18">
        </span>
      </span>
    </button>
  </div>

  <!-- Полное видео со звуком: по «Смотреть» раскрывается из карточки-картинки (или кнопки) на весь блок (js/modules/video.js) -->
  <div class="video__player" data-js-video-player hidden>
    <video class="video__player-media" src="./assets/video/video-main.mp4" poster="./assets/images/video-card.webp" width="1920" height="1080" playsinline preload="none" data-js-video-main></video>
    <button class="video__close" type="button" aria-label="Закрыть видео" data-js-video-close>
      <svg width="44" height="44" viewBox="0 0 44 44" fill="currentColor" aria-hidden="true">
        <path d="M23.414 22L30 15.414L28.586 14L22 20.586L15.414 14L14 15.414L20.586 22L14 28.586L15.414 30L22 23.414L28.586 30L30 28.586L23.414 22Z"/>
      </svg>
    </button>
  </div>
</section>

<div class="field {{ mod }}" data-js-field>
  <div class="field__box">
    <input class="field__input" id="{{ id }}" type="{{ type }}" name="{{ name }}" autocomplete="{{ autocomplete }}" placeholder=" " aria-describedby="{{ id }}-hint" data-js-field-input {{ attrs }}>
    <label class="field__label" for="{{ id }}">{{ label }}</label>
  </div>
  <p class="field__hint" id="{{ id }}-hint" data-js-field-hint></p>
</div>

<section class="usage container" data-header-theme="light" data-js-reveal-sequence>
  <h2 class="usage__title section-title" data-js-reveal-sequence-item data-reveal-sequence-split>Рекомендуемый курс <br>не&nbsp;менее 3&nbsp;мес</h2>

  <div class="usage__grid">
    <div class="usage__main" data-js-reveal-sequence-item>
      <img class="usage__main-img" src="./assets/images/usage-main.webp" alt="" width="1268" height="1241" loading="lazy">
      <div class="usage__badge">
        <span class="icon-circle"><img src="./assets/icons/icn-sun.svg" alt="" width="24" height="24"></span>
        <p class="usage__badge-text">Один раз в&nbsp;день</p>
      </div>
      <div class="usage__badge">
        <span class="icon-circle"><img src="./assets/icons/icn-date.svg" alt="" width="24" height="24"></span>
        <p class="usage__badge-text">Каждый день</p>
      </div>
    </div>

    <div class="usage__cards">
      <div class="usage__card usage__card--glass" data-js-reveal-sequence-item>
        <img class="usage__glass-img" src="./assets/images/usage-glass.webp" alt="" width="800" height="800" loading="lazy">
        <p class="usage__card-text">содержимое пакета растворить в&nbsp;100–150&nbsp;мл&nbsp;воды или&nbsp;принять прямо из&nbsp;саше</p>
      </div>
      <div class="usage__card usage__card--time" data-js-reveal-sequence-item>
        <span class="icon-circle"><img src="./assets/icons/icn-glass.svg" alt="" width="24" height="24"></span>
        <p class="usage__card-text">выпить за&nbsp;30–40&nbsp;минут до&nbsp;приёма пищи</p>
      </div>
    </div>
  </div>
</section>

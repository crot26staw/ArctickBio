<!--
  Товар в корзине (макет 18182:42856, текст — 18920:36110: название и вкус мини-карточки, ниже формат; «Разобрали» — 18269:34323). Разметка — как в мини-корзине WooCommerce:
  li.woocommerce-mini-cart-item, ссылка удаления .remove_from_cart_button с data-product_id / data-cart_item_key.
  Нет в наличии — mod "cart-item--sold", вместо счётчика и цены — подпись «Разобрали» и «Удалить».
  data-price — цена за штуку (для пересчёта в js/modules/cart.js).
-->
<li class="cart-item woocommerce-mini-cart-item mini_cart_item {{ mod }}" data-js-cart-item data-price="{{ price_value }}" data-cart_item_key="{{ key }}">
  <a class="cart-item__media" href="{{ link }}" tabindex="-1" aria-hidden="true">
    <img class="cart-item__img" src="./assets/images/product-{{ flavor }}-mini.webp" alt="" width="240" height="186" loading="lazy">
  </a>
  <div class="cart-item__body">
    <div class="cart-item__text">
      <div class="cart-item__name">
        <a class="cart-item__title" href="{{ link }}">{{ title }}</a>
        <p class="cart-item__subtitle">{{ subtitle }}</p>
      </div>
      <p class="cart-item__format">{{ format }}</p>
    </div>
    <div class="cart-item__actions">
      <div class="cart-item__controls">
        <div class="cart-item__quantity quantity quantity--mini" data-js-quantity>
          <button class="quantity__btn" type="button" aria-label="Уменьшить количество" data-js-quantity-minus>
            <svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true"><path d="M7.55123 9.49756H4.97656V8.60156H11.0119V9.49756H7.55256H7.55123Z"/></svg>
          </button>
          <input class="quantity__input input-text qty text" type="number" name="cart[{{ key }}][qty]" value="{{ qty }}" min="1" max="99" step="1" inputmode="numeric" aria-label="Количество" data-js-quantity-input>
          <button class="quantity__btn" type="button" aria-label="Увеличить количество" data-js-quantity-plus>
            <svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true"><path d="M7.65346 12.0624V9.49906H5.07812V8.60306H7.65413V6.03906H8.55013V8.6024H11.1135V9.4984H8.55013V12.0617H7.65413L7.65346 12.0624Z"/></svg>
          </button>
        </div>
        <a class="cart-item__remove remove remove_from_cart_button" href="#" data-product_id="{{ id }}" data-cart_item_key="{{ key }}" data-js-cart-remove data-js-roll>Удалить</a>
        <p class="cart-item__sold">Разобрали</p>
      </div>
      <span class="cart-item__price price" data-js-cart-item-price>{{ price }}</span>
    </div>
  </div>
</li>

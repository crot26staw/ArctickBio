<section class="compound-stats" data-header-theme="light">
  <div class="compound-stats__rocks" aria-hidden="true">
    <img src="./assets/images/rock-bottom.webp" alt="" width="2169" height="725" loading="lazy">
  </div>

  <h2 class="compound-stats__title section-title" data-js-title-reveal>Показываем состав полностью</h2>

  <div class="compound-stats__sachet" aria-hidden="true">
    <img src="./assets/images/sachet.webp" alt="" width="820" height="1024" loading="lazy">
  </div>

  <div class="compound-stats__stat compound-stats__stat--percent">
    <p class="compound-stats__value">98%</p>
    <p class="compound-stats__label">коллагена <br>в сухом веществе</p>
  </div>
  <p class="compound-stats__note compound-stats__note--amino">- 18 аминокислот в составе</p>

  <div class="compound-stats__stat compound-stats__stat--mass">
    <p class="compound-stats__value">5&nbsp;000 <span class="compound-stats__unit">мг</span></p>
    <p class="compound-stats__label">коллагена</p>
  </div>
  <ul class="compound-stats__notes">
    <li class="compound-stats__note">- 5 грамм коллагена</li>
    <li class="compound-stats__note">- 5 грамм натуральных ягод</li>
  </ul>
</section>

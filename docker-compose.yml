# Локальное окружение WordPress (см. WORDPRESS.md → «Локальное окружение»)
name: arctik-bio

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme/arctik-bio:/var/www/html/wp-content/themes/arctik-bio
      - ./docker/php.ini:/usr/local/etc/php/conf.d/arctik.ini:ro

  # WP-CLI: docker compose run --rm wpcli <команда>
  wpcli:
    image: wordpress:cli-php8.2
    profiles: [cli]
    user: "33:33"
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX}
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme/arctik-bio:/var/www/html/wp-content/themes/arctik-bio
      - ./docker/php.ini:/usr/local/etc/php/conf.d/arctik.ini:ro
      - ./scripts/out:/out

  # Ловушка писем: WP Mail SMTP локально шлёт на mailpit:1025, письма — http://localhost:${MAIL_PORT}
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAIL_PORT}:8025"

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M

volumes:
  db_data:
  wp_data:

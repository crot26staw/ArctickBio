<li class="production-step production-step--{{ num }}" data-js-step-popup>
  <h3 class="production-step__title"><span>{{ title }}</span></h3>
  <div class="production-step__img-wrap">
    <img class="production-step__img" src="{{ img }}" alt="" width="{{ width }}" height="{{ height }}" loading="lazy">
  </div>
  <span class="production-step__beam" aria-hidden="true"></span>
  <button class="production-step__marker" type="button" aria-label="Подробнее о шаге {{ num }}" aria-expanded="false" data-js-step-popup-toggle data-js-swipe>
    <img src="./assets/icons/icn-ingredients-accent.svg" alt="" width="32" height="32">
  </button>
  <div class="production-step__popup">
    <div class="production-step__popup-text">
      <span class="production-step__popup-num">{{ num }}</span>
      <div>
        <p class="production-step__popup-title">{{ popup-title }}</p>
        <p class="production-step__popup-desc">{{ popup-desc }}</p>
      </div>
    </div>
    <div class="production-step__popup-img-wrap">
      <video class="production-step__popup-video" src="{{ popup-video }}" poster="{{ popup-poster }}" width="700" height="394" muted loop playsinline preload="none" aria-hidden="true" data-js-step-popup-video></video>
    </div>
  </div>
</li>

<section class="benefits {{ mod }}" data-header-theme="dark" data-js-fake-glass>
  <img class="benefits__bg" data-js-fake-glass-source src="./assets/images/benefits-bg.webp" alt="" width="1683" height="935" loading="lazy">
  <div class="benefits__inner container">
    <h2 class="section-title section-title--white" data-js-title-reveal>Регулярный приём помогает <br>поддерживать</h2>
    <!-- На планшете ряд шире экрана — листается свайпом (js/modules/drag-slider.js) -->
    <div class="benefits__viewport" data-js-drag-slider data-drag-slider-align="start">
      <ul class="benefits__list" data-js-cards-rise data-js-drag-slider-track>
        <li class="benefit-card" data-js-cards-rise-item data-js-fake-glass-item>
          <img class="benefit-card__icon" src="./assets/icons/icn-skin.svg" alt="" width="80" height="80" loading="lazy">
          <p class="benefit-card__title">упругость <br>и эластичность кожи</p>
        </li>
        <li class="benefit-card" data-js-cards-rise-item data-js-fake-glass-item>
          <img class="benefit-card__icon" src="./assets/icons/icn-joints.svg" alt="" width="80" height="80" loading="lazy">
          <p class="benefit-card__title">подвижность суставов</p>
        </li>
        <li class="benefit-card" data-js-cards-rise-item data-js-fake-glass-item>
          <img class="benefit-card__icon" src="./assets/icons/icn-ligaments.svg" alt="" width="80" height="80" loading="lazy">
          <p class="benefit-card__title">связки при физических нагрузках суставов</p>
        </li>
        <li class="benefit-card" data-js-cards-rise-item data-js-fake-glass-item>
          <img class="benefit-card__icon" src="./assets/icons/icn-connective.svg" alt="" width="80" height="80" loading="lazy">
          <p class="benefit-card__title">соединительную ткань при ежедневных нагрузках</p>
        </li>
        <li class="benefit-card" data-js-cards-rise-item data-js-fake-glass-item>
          <img class="benefit-card__icon" src="./assets/icons/icn-hair-nails.svg" alt="" width="80" height="80" loading="lazy">
          <p class="benefit-card__title">здоровый рост волос <br>и ногтей</p>
        </li>
      </ul>
    </div>
  </div>
</section>
